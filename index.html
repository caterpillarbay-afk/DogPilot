<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DogPilot</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{
    --bg:#0a1615; --panel:#122320; --panel-2:#0e1c1a; --panel-3:#16302c;
    --accent:#2fd8c4; --accent-dim:#1c8f82; --text:#eef8f6; --text-dim:#93a9a6;
    --border:rgba(255,255,255,0.08); --danger:#e5566b; --radius:16px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0a1615; --panel:#122320; --panel-2:#0e1c1a; --panel-3:#16302c;
      --text:#eef8f6; --text-dim:#93a9a6; --border:rgba(255,255,255,0.08);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; justify-content:center; overflow-x:hidden;
  }
  .phone{
    width:100%; max-width:430px; min-height:100dvh;
    display:flex; flex-direction:column; position:relative;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px; border-bottom:1px solid var(--border);
    padding-top:calc(18px + env(safe-area-inset-top,0px));
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand svg{width:38px; height:38px; flex:none;}
  .brand-text h1{font-size:19px; margin:0; letter-spacing:0.3px;}
  .brand-text h1 b{color:var(--accent); font-weight:800;}
  .brand-text p{margin:2px 0 0; font-size:11.5px; color:var(--text-dim);}
  .header-tag{font-size:10.5px; color:var(--text-dim); text-align:right; line-height:1.4;}
  main{flex:1; padding:20px 20px 8px; overflow-y:auto;}
  h2.title{font-size:26px; margin:6px 0 2px; font-weight:700;}
  p.subtitle{color:var(--text-dim); margin:0 0 18px; font-size:13.5px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:16px;
  }
  .card-label{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; font-weight:600; color:var(--accent); margin-bottom:14px;
  }
  .card-label span.plain{color:var(--text); font-weight:600;}
  .field-row{display:flex; align-items:flex-end; gap:10px; margin-bottom:12px;}
  .field{flex:1; min-width:0;}
  .field label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px;}
  .field .box{
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:15px; font-weight:600;
  }
  .field input{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:15px; font-weight:600; color:var(--text); font-family:inherit;
  }
  .arrow-mid{color:var(--text-dim); padding-bottom:12px;}
  .btn-primary{
    width:100%; background:var(--accent); color:#03211e; border:none; border-radius:12px;
    padding:15px; font-size:16px; font-weight:700; cursor:pointer;
  }
  .btn-primary:active{opacity:0.85;}
  .btn-outline{
    width:100%; background:transparent; color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:14px; font-size:15px; font-weight:600; cursor:pointer;
  }
  .section-head{display:flex; align-items:center; justify-content:space-between; margin:4px 0 12px;}
  .section-head h3{font-size:13px; letter-spacing:0.4px; margin:0; color:var(--text-dim); font-weight:700;}
  .section-head a{font-size:12.5px; color:var(--accent); text-decoration:none; cursor:pointer;}
  .companions{display:flex; gap:10px; margin-bottom:20px;}
  .comp-card{
    flex:1; background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:12px; text-align:center;
  }
  .comp-card .cap{font-size:11px; color:var(--text-dim); display:block; margin-bottom:8px; text-align:left;}
  .avatars{display:flex; justify-content:center; gap:-6px;}
  .avatar{
    width:44px; height:44px; border-radius:50%; background:var(--panel-3);
    display:flex; align-items:center; justify-content:center; font-size:20px;
    border:2px solid var(--panel); margin-left:-10px; overflow:hidden; position:relative;
  }
  .avatar:first-child{margin-left:0;}
  .comp-names{margin-top:8px; font-size:12.5px; font-weight:600;}
  .veh-icon{font-size:30px; margin:4px 0;}
  .veh-name{font-size:12.5px; font-weight:600; overflow-wrap:break-word;}
  .veh-brand{font-size:10.5px; color:var(--text-dim); letter-spacing:.3px; overflow-wrap:break-word;}
  .charge-icon{font-size:30px; margin:4px 0; color:var(--accent);}
  .photo-slot{cursor:pointer; position:relative;}
  .photo-slot img{width:100%; height:100%; object-fit:cover; border-radius:inherit;}
  .veh-photo-wrap{
    width:64px; height:44px; border-radius:10px; margin:4px auto; overflow:hidden;
    background:var(--panel-3); display:flex; align-items:center; justify-content:center;
  }
  .veh-photo-wrap img{width:100%; height:100%; object-fit:cover;}
  .edit-badge{
    position:absolute; bottom:-2px; right:-2px; background:var(--accent); color:#03211e;
    width:16px; height:16px; border-radius:50%; font-size:10px; display:flex;
    align-items:center; justify-content:center; border:2px solid var(--panel);
  }
  .comp-card .cap{display:flex; align-items:center; justify-content:space-between;}
  .stops-count{font-size:12px; color:var(--text-dim);}
  .stop-cards{display:flex; gap:10px; overflow-x:auto; margin-bottom:18px; padding-bottom:2px;}
  .stop-card{
    flex:1; min-width:150px; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:13px; cursor:pointer;
  }
  .stop-card:active{border-color:var(--accent);}
  .stop-card .cap{font-size:11px; color:var(--text-dim); margin-bottom:4px; display:block;}
  .stop-card .name{font-weight:700; font-size:14.5px; margin-bottom:8px;}
  .icon-row{display:flex; gap:8px; font-size:15px; margin-bottom:8px; color:var(--accent);}
  .stop-meta{font-size:11px; color:var(--text-dim);}
  .bottom-actions{display:flex; gap:10px; margin-bottom:14px;}
  .bottom-actions .btn-primary{flex:1.3;}
  .bottom-actions .btn-outline{flex:1;}
  nav.tabbar{
    display:flex; border-top:1px solid var(--border); padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--bg);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-dim); display:flex; flex-direction:column;
    align-items:center; gap:4px; font-size:11.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar .dash{width:26px; height:3px; border-radius:2px; margin-top:3px; background:transparent;}
  nav.tabbar button.active .dash{background:var(--accent);}
  .icon{font-size:20px;}

  /* Stop detail */
  .back-row{display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:2px;}
  .back-row .chev{font-size:20px; color:var(--text);}
  .hero{
    position:relative; border-radius:var(--radius); overflow:hidden; height:190px; margin:14px 0 16px;
    background:linear-gradient(160deg,#0c2624,#123330 55%,#0a1a18);
    border:1px solid var(--border);
  }
  .hero .badge{
    position:absolute; top:12px; left:12px; background:rgba(6,20,18,0.75); backdrop-filter:blur(2px);
    padding:8px 12px; border-radius:10px; font-size:11px; line-height:1.3;
  }
  .hero .badge b{display:block; font-size:14px;}
  .hero .fav{
    position:absolute; top:12px; right:12px; background:rgba(6,20,18,0.75); border:1px solid var(--border);
    padding:8px 12px; border-radius:20px; font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer;
  }
  .hero .fav.on{color:var(--danger);}
  .hero .caption{
    position:absolute; bottom:12px; right:14px; text-align:right; font-size:11px; color:var(--text-dim);
  }
  .hero .caption b{display:block; color:var(--text); font-size:14px;}
  .hero-art{position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; opacity:0.9;}
  h2.stop-title{font-size:23px; margin:0 0 2px;}
  .rating-row{display:flex; gap:10px; margin-bottom:16px;}
  .rating-card{flex:1; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:12px; text-align:center;}
  .rating-card .icon{display:block; margin-bottom:4px;}
  .rating-card .val{font-size:19px; font-weight:800;}
  .rating-card .lbl{font-size:11px; color:var(--text-dim);}
  .info-list{display:grid; grid-template-columns:1fr 1fr; gap:9px 14px; font-size:13.5px;}
  .info-list div{display:flex; align-items:center; gap:8px;}
  .check-row{display:flex; gap:8px; flex-wrap:wrap; font-size:12.5px;}
  .check-row span{background:var(--panel-2); border-radius:20px; padding:5px 11px; color:var(--accent);}
  .charge-stats{display:flex; justify-content:space-between; margin-top:12px; text-align:center;}
  .charge-stats div{flex:1;}
  .charge-stats b{display:block; font-size:16px; font-weight:800;}
  .charge-stats span{font-size:11px; color:var(--text-dim);}
  .placeholder{padding:60px 10px; text-align:center; color:var(--text-dim);}
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:var(--panel-3); border:1px solid var(--border); padding:10px 18px; border-radius:20px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50;
  }
  .toast.show{opacity:1;}
  .view{display:none;}
  .map-screen{position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; flex-direction:column;}
  .map-header{display:flex; align-items:center; gap:10px; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--border);}
  .map-header .chev{font-size:22px; cursor:pointer;}
  #liveMap{flex:1; width:100%;}
  .map-status{padding:12px 16px; border-top:1px solid var(--border); background:var(--panel); font-size:13px;}
  .map-status b{color:var(--accent);}
  .leaflet-popup-content-wrapper, .leaflet-popup-tip{background:var(--panel); color:var(--text);}
  .car-icon{font-size:22px; text-align:center; line-height:1;}
  .view.active{display:block;}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const favorites = {};
const photos = {}; // schoko, fibi, vehicle -> URL
let tomtomKeyVisible = false; // Key im Profil nur auf Wunsch (👁) im Klartext zeigen
let tomtomApiKey = ''; // eigener, kostenloser Key von developer.tomtom.com (2.500 Anfragen/Tag)
let routeTrafficDelayMin = null; // Verzögerung durch aktuellen Verkehr laut TomTom, in Minuten
let routeStart = '';
let routeZiel = '';
let startBattery = 80;
const MANDATORY_STOP_MAX_MINUTES = 20; // Sicherheitsfenster – ab wann ein Ladestopp zwingend fällig wird
let vehicleCapacityKWh = 76.6;         // Audi Q4 45 e-tron, Netto-Kapazität
let vehicleConsumptionKWh100 = 23;     // realer Verbrauch mit Dachbox + 2 Hunden + 2 Personen + Gepäck (beobachtet: 21–25)
// Fahrzeugdatenbank (vehicle-database.json, aus EEA-CO2-Monitoringdaten – siehe scripts/build-vehicle-database.mjs)
let vehicleDb = null;            // [{marke, modell, verbrauchKWh100}]
let vehicleDbStatus = 'idle';    // idle | loading | ok | missing
let vehicleModel = null;         // gewähltes Fahrzeug {marke, modell} oder null = manuell
let vehicleMarkeFilter = '';     // im Marken-Dropdown gewählt, Modell noch offen
let desiredMinKw = 150; // gewünschte Mindest-Ladeleistung – bestimmt, welche Ladepunkte als "geeignet" gelten

function getRemainingRangeInfo(){
  const rangeKm = (startBattery/100) * vehicleCapacityKWh / getEffectiveConsumptionKWh100() * 100;
  const avgKmh = (routeDistanceKm && routeDurationMin) ? (routeDistanceKm / (routeDurationMin/60)) : 90;
  const rangeMin = rangeKm / avgKmh * 60;
  return { rangeKm, rangeMin, avgKmh };
}
let routeDistanceKm = null;
let routeDurationMin = null;
let routeApprox = false;
let routeStraightLineKm = null; // Luftlinie Start-Ziel, zur Umrechnung der Stopp-Positionen auf echte km

function toRealKm(straightLineKm){
  const scale = (routeDistanceKm && routeStraightLineKm) ? routeDistanceKm / routeStraightLineKm : 1;
  return Math.round(straightLineKm * scale);
}
let activeStop = null;

function photoOr(id, fallbackHtml){
  return photos[id] ? `<img src="${photos[id]}" alt="">` : fallbackHtml;
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),1600);
}

function renderFahrt(){
  return `
  <h2 class="title">Fahrt vorbereiten</h2>
  <p class="subtitle">Route, Energie und Pausen auf einen Blick.</p>

  <div class="card">
    <div class="card-label"><span>🧭 ROUTE &amp; PLANUNG</span></div>
    <div class="field-row">
      <div class="field"><label>Start</label><input id="startInput" placeholder="Ort oder ganze Adresse" value="${routeStart}"></div>
      <div class="arrow-mid">→</div>
      <div class="field"><label>Ziel</label><input id="zielInput" placeholder="Ort oder ganze Adresse" value="${routeZiel}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Strecke</label><div class="box">${routeDistanceKm!=null ? routeDistanceKm+' km'+(routeApprox?' *':'') : '–'}</div></div>
      <div class="field"><label>Fahrzeit</label><div class="box">${routeDurationMin!=null ? formatDuration(routeDurationMin) : '–'}</div></div>
      <div class="field"><label>Verkehr</label><div class="box" style="font-size:13px;">${(()=>{
        if(routeTrafficDelayMin==null) return tomtomApiKey ? '–' : '⚙️ kein Key';

const IDB_NAME = 'dogpilot';
const IDB_STORE = 'files';

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key, value){
  try{
    const db = await idbOpen();
    return new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>resolve(false);
    });
  }catch(e){ return false; }
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>resolve(undefined);
    });
  }catch(e){ return undefined; }
}
async function idbDelete(key){
  try{
    const db = await idbOpen();
    return new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>resolve(false);
    });
  }catch(e){ return false; }
}

// Geokodierung über OpenStreetMap/Nominatim (kostenlos, kein API-Key nötig).
// Funktioniert nur mit echtem Netzwerkzugriff, also erst nach dem Deployment,
// nicht in dieser Chat-Vorschau.
async function geocode(place){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=${encodeURIComponent(place)}`;
  let res;
  try{
    res = await fetch(url, { headers: { 'Accept-Language': 'de' } });
  }catch(networkErr){
    throw new Error('Keine Netzwerkverbindung – Ortssuche funktioniert erst nach dem Deployment (nicht in dieser Vorschau)');
  }
  if(!res.ok) throw new Error('Geocoding fehlgeschlagen');
  const data = await res.json();
  if(!data.length) throw new Error(`Ort "${place}" nicht gefunden`);
  const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
  coords.label = data[0].display_name || place; // gefundene Adresse, zur Bestätigung anzeigbar
  return coords;
}

const FACILITY_LABELS = {
  toilet:['🚻','WC'], shower:['🚿','Dusche'], motorwayRestaurant:['🍽️','Raststätte/Restaurant'],
  petrolStation:['⛽','Tankstelle'], picnicFacilities:['🧺','Picknickbereich'], playground:['🛝','Spielplatz'],
  freshWater:['🚰','Frischwasser'], defibrillator:['➕','Defibrillator'], firstAidEquipment:['🩹','Erste-Hilfe'],
  refuseBin:['🗑️','Mülleimer'], motel:['🛏️','Motel'], police:['🚓','Polizei'],
  leisureActivities:['🎡','Freizeitangebot'], docstop:['📋','Docstop'], dumpingStation:['🚛','Entsorgungsstation'],
};

function haversineKm(lat1, lon1, lat2, lon2){
  const r = 6371;
  const p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180;
  const dphi = (lat2-lat1)*Math.PI/180, dlmb = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dphi/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dlmb/2)**2;
  return 2*r*Math.asin(Math.sqrt(a));
}
function pointToSegmentKm(lat, lon, lat1, lon1, lat2, lon2){
  const ax=lon1, ay=lat1, bx=lon2, by=lat2, px=lon, py=lat;
  const abx=bx-ax, aby=by-ay, apx=px-ax, apy=py-ay;
  const ab2 = abx*abx+aby*aby;
  const t = ab2===0 ? 0 : Math.max(0, Math.min(1, (apx*abx+apy*aby)/ab2));
  const cx=ax+t*abx, cy=ay+t*aby;
  return { dist: haversineKm(lat, lon, cy, cx), t };
}

function parseChargingCSV(text){
  const lines = text.split(/\r?\n/);
  let headerIdx = -1, header = null;
  for(let i=0;i<lines.length;i++){
    const cells = lines[i].split(';');
    if(cells[0] && cells[0].replace(/^\uFEFF/,'').trim() === 'Ladeeinrichtungs-ID'){
      headerIdx = i; header = cells.map(c=>c.trim()); break;
    }
  }
  if(headerIdx === -1) throw new Error('Header "Ladeeinrichtungs-ID" nicht gefunden');
  const col = {}; header.forEach((h,i)=>{ col[h]=i; });
  const points = [];
  for(let i=headerIdx+1;i<lines.length;i++){
    const r = lines[i].split(';');
    if(r.length < header.length || !r[0]) continue;
    const lat = parseFloat((r[col['Breitengrad']]||'').replace(',','.'));
    const lon = parseFloat((r[col['Längengrad']]||'').replace(',','.'));
    const kw = parseFloat((r[col['Nennleistung Ladeeinrichtung [kW]']]||'').replace(',','.'));
    if(Number.isNaN(lat) || Number.isNaN(lon)) continue;
    points.push({
      lat, lon, kw: Number.isNaN(kw) ? 0 : kw,
      anzahlLadepunkte: parseInt(r[col['Anzahl Ladepunkte']]||'0', 10) || 0,
      betreiber: r[col['Betreiber']] || '',
    });
  }
  return points;
}

function parseRestAreasXML(text){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const err = doc.querySelector('parsererror');
  if(err) throw new Error('XML konnte nicht gelesen werden');
  const NS = 'http://datex2.eu/schema/2/2_0';
  const records = doc.getElementsByTagNameNS(NS, 'parkingRecord');
  const areas = [];
  for(const rec of records){
    const id = rec.getAttribute('id') || '';
    const nameEl = rec.getElementsByTagNameNS(NS,'parkingName')[0];
    let name = id;
    if(nameEl){
      const v = nameEl.getElementsByTagNameNS(NS,'value')[0];
      if(v && v.textContent) name = v.textContent;
    }
    if(/rückbau/i.test(name)) continue; // stillgelegte/im Abriss befindliche Anlage überspringen
    const latEl = rec.getElementsByTagNameNS(NS,'latitude')[0];
    const lonEl = rec.getElementsByTagNameNS(NS,'longitude')[0];
    if(!latEl || !lonEl) continue;
    const lat = parseFloat(latEl.textContent), lon = parseFloat(lonEl.textContent);
    if(Number.isNaN(lat) || Number.isNaN(lon)) continue;
    const equipment = [...rec.getElementsByTagNameNS(NS,'equipmentType')].map(e=>e.textContent).filter(Boolean);
    const services = [...rec.getElementsByTagNameNS(NS,'serviceFacilityType')].map(e=>e.textContent).filter(Boolean);
    const spacesEl = rec.getElementsByTagNameNS(NS,'parkingNumberOfSpaces')[0];
    const spaces = spacesEl ? parseInt(spacesEl.textContent||'0',10) : 0;
    const distEl = rec.getElementsByTagNameNS(NS,'distanceToThisRoad')[0];
    const distanceToMotorwayM = distEl ? parseFloat(distEl.textContent) : null;
    const isAutohof = /autohof|truckstop/i.test(name);
    areas.push({ id, name, lat, lon, equipment, services, spaces, distanceToMotorwayM, isAutohof });
  }
  return areas;
}

function scoreStop(area, nearbyCharging){
  const maxKw = nearbyCharging.reduce((m,c)=>Math.max(m,c.kw), 0);
  const nPoints = nearbyCharging.reduce((s,c)=>s + (c.anzahlLadepunkte||0), 0);
  const betreiber = nearbyCharging.length
    ? [...nearbyCharging].sort((a,b)=>b.kw-a.kw)[0].betreiber
    : null;
  const scoreLaden = nearbyCharging.length ? Math.min(5, 1 + 4*Math.min(1, maxKw/150)) : 1;
  const eq = new Set(area.equipment), sv = new Set(area.services);
  let scoreMensch = 2.5;
  if(eq.has('toilet')) scoreMensch += 0.8;
  if(sv.has('motorwayRestaurant')) scoreMensch += 0.8;
  if(eq.has('shower')) scoreMensch += 0.5;
  if(eq.has('freshWater')) scoreMensch += 0.4;
  scoreMensch = Math.min(5, scoreMensch);
  let scoreHund = 2.8;
  if(eq.has('picnicFacilities')) scoreHund += 0.7;
  if(sv.has('leisureActivities')) scoreHund += 0.6;
  if(eq.has('freshWater')) scoreHund += 0.5;
  if(area.spaces >= 20) scoreHund += 0.4;
  scoreHund = Math.min(5, scoreHund);
  return { hund: Math.round(scoreHund*10)/10, laden: Math.round(scoreLaden*10)/10,
           mensch: Math.round(scoreMensch*10)/10, maxKw, nPoints, betreiber };
}

function computeRouteStops(charging, areas, start, end, corridorKm=15, chargeRadiusKm=1){
  const totalDist = haversineKm(start[0],start[1],end[0],end[1]);
  const stops = [];
  for(const a of areas){
    const { dist, t } = pointToSegmentKm(a.lat, a.lon, start[0], start[1], end[0], end[1]);
    if(dist > corridorKm) continue;
    const nearby = charging.filter(c => haversineKm(a.lat,a.lon,c.lat,c.lon) <= chargeRadiusKm);
    const sc = scoreStop(a, nearby);
    stops.push({ ...a, km: Math.round(t*totalDist*10)/10, ...sc });
  }
  stops.sort((x,y)=>x.km-y.km);
  return stops;
}

function readFileAsText(file, encoding){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(reader.error);
    if(encoding) reader.readAsText(file, encoding); else reader.readAsText(file);
  });
}

const ocmStatusCache = {};

async function loadOcmStatus(lat, lon){
  const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
  if(ocmStatusCache[key]) return ocmStatusCache[key];
  const url = `https://api.openchargemap.io/v3/poi/?output=json&latitude=${lat}&longitude=${lon}&distance=1&distanceunit=KM&maxresults=20&compact=true&verbose=false`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Open Charge Map nicht erreichbar');
  const data = await res.json();
  let operational=0, faulted=0, unknown=0, total=0;
  for(const poi of data){
    for(const c of (poi.Connections||[])){
      total++;
      const id = c.StatusTypeID;
      if(id===50) operational++;
      else if(id===30||id===75||id===150) faulted++;
      else unknown++;
    }
  }
  const result = { operational, faulted, unknown, total, pois: data.length };
  ocmStatusCache[key] = result;
  return result;
}

let routeGeometry = null; // Array von [lat,lon] entlang der echten Fahrstrecke (für die Karte)
let routeStartCoords = null;
let routeEndCoords = null;

async function loadRouteInfo(start, end){
  routeTrafficDelayMin = null;
  // Mit eigenem TomTom-Key: echte Route inkl. Live-Verkehr (Distanz, Fahrzeit, Stau-Verzögerung)
  if(tomtomApiKey){
    try{
      const url = `https://api.tomtom.com/routing/1/calculateRoute/${start[0]},${start[1]}:${end[0]},${end[1]}/json?key=${tomtomApiKey}&traffic=true&travelMode=car&routeType=fastest`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('TomTom-Fehler');
      const data = await res.json();
      const route = data.routes && data.routes[0];
      if(!route) throw new Error('Keine Route gefunden');
      routeDistanceKm = Math.round(route.summary.lengthInMeters / 1000);
      routeDurationMin = Math.round(route.summary.travelTimeInSeconds / 60);
      routeTrafficDelayMin = Math.round((route.summary.trafficDelayInSeconds || 0) / 60);
      routeGeometry = (route.legs || []).flatMap(leg => (leg.points||[]).map(p => [p.latitude, p.longitude]));
      routeApprox = false;
      return;
    }catch(err){
      // Kein Abbruch – fällt unten auf OSRM zurück (ohne Live-Verkehr)
    }
  }
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('OSRM-Fehler');
    const data = await res.json();
    if(!data.routes || !data.routes.length) throw new Error('Keine Route gefunden');
    routeDistanceKm = Math.round(data.routes[0].distance / 1000);
    routeDurationMin = Math.round(data.routes[0].duration / 60);
    routeGeometry = (data.routes[0].geometry?.coordinates || []).map(c => [c[1], c[0]]);
    routeApprox = false;
  }catch(err){
    const d = haversineKm(start[0], start[1], end[0], end[1]);
    routeDistanceKm = Math.round(d);
    routeDurationMin = Math.round(d / 90 * 60); // Schätzung: ø 90 km/h
    routeGeometry = [start, end];
    routeApprox = true;
  }
}

// Grobe Heuristik (keine Physik-Simulation!): Stop-and-Go im Stau erhöht den
// Verbrauch. Je größer der Anteil der Fahrzeit, der im Stau verloren geht,
// desto höher der Aufschlag – gedeckelt bei +15%.
function getEffectiveConsumptionKWh100(){
  if(!routeTrafficDelayMin || !routeDurationMin) return vehicleConsumptionKWh100;
  const delayRatio = routeTrafficDelayMin / routeDurationMin;
  const bump = Math.min(0.15, delayRatio * 0.5);
  return vehicleConsumptionKWh100 * (1 + bump);
}

function formatDuration(min){
  const h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? `${h} h ${m} min` : `${m} min`;
}

}

// Empfehlungslogik: primär Hund-Score (Grünfläche/Auslauf – die "DP-Intuition"),
// außer der Start-Akku ist niedrig – dann muss der ERSTE Stopp ein reiner
// Lade-Stopp sein, unabhängig vom Hund-Score.
const TRIGGER_SOC_PERCENT = 15;   // ab diesem Akkustand beginnt die Stopp-Suche
const TARGET_SOC_AFTER_CHARGE = 80; // angenommener Ladestand nach jedem Ladestopp

// Ganzheitliche Ladeplanung für die komplette Strecke: simuliert den Akkustand
// von Start bis Ziel, sucht bei Erreichen von TRIGGER_SOC_PERCENT einen Stopp,
// der Laden + Hund + Kaffee kombiniert (nicht nur die nächste Ladesäule),
// "lädt" dort auf TARGET_SOC_AFTER_CHARGE und fährt weiter bis zum nächsten
// Trigger-Punkt oder zum Ziel.
const EMERGENCY_CHECK_RANGE_KM = 60; // unter dieser Reichweite zuerst lokal (egal ob Autobahn) suchen

function findEmergencyChargingNearby(lat, lon, searchRadiusKm){
  if(!importedCharging || !importedCharging.length) return null;
  const candidates = importedCharging
    .map(c => ({ ...c, distKm: haversineKm(lat, lon, c.lat, c.lon) }))
    .filter(c => c.distKm <= searchRadiusKm && c.kw > 0);
  if(!candidates.length) return null;
  const highPower = candidates.filter(c => c.kw >= desiredMinKw);
  const pool = highPower.length ? highPower : candidates;
  return [...pool].sort((a,b)=> a.distKm - b.distKm)[0];
}

function planTripStops(stops){
  if(!routeDistanceKm) return [];
  const byKm = (stops || []).map(s=>({ ...s, realKm: toRealKm(s.km) })).sort((a,b)=>a.realKm-b.realKm);
  const kmPerPercent = vehicleCapacityKWh / getEffectiveConsumptionKWh100(); // km pro 1% Akku

  let currentKm = 0;
  let currentSoc = startBattery;
  const plan = [];
  const used = new Set();
  let guard = 0;

  // Notfall-Check: Reicht der Akku ab Start kaum, wird ZUERST im unmittelbaren Umkreis
  // gesucht (jeder Ladepunkt aus dem Register, nicht nur Autobahn-Rastanlagen) – die
  // Autobahn ist bei kritischem Akkustand tabu, ein Supermarkt-Lader um die Ecke zählt mehr.
  const startRangeKm = Math.max(0, currentSoc - TRIGGER_SOC_PERCENT) * kmPerPercent;
  if(startRangeKm < EMERGENCY_CHECK_RANGE_KM && routeStartCoords){
    const searchRadius = Math.max(startRangeKm, 3); // mind. 3 km Suchradius, auch bei ~0 km Reichweite
    const nearby = findEmergencyChargingNearby(routeStartCoords[0], routeStartCoords[1], searchRadius);
    if(nearby){
      plan.push({
        name: nearby.betreiber ? `Ladepunkt: ${nearby.betreiber}` : 'Ladepunkt in der Nähe',
        lat: nearby.lat, lon: nearby.lon, realKm: 0,
        hund: null, mensch: null, laden: nearby.kw>=150 ? 5 : 3, maxKw: nearby.kw,
        isAutohof: false, distanceToMotorwayM: null, equipment: [], services: [],
        _stopNumber: 1, _notfallLadepunkt: true, _distKm: Math.round(nearby.distKm*10)/10,
      });
      currentSoc = TARGET_SOC_AFTER_CHARGE; // danach wie gewohnt weiterplanen
      lastEmergencyStop = plan[0];
    }
  }

  while(currentKm < routeDistanceKm && guard++ < 15){
    const reachableKm = currentKm + Math.max(0, currentSoc - TRIGGER_SOC_PERCENT) * kmPerPercent;
    if(reachableKm >= routeDistanceKm) break; // Ziel ohne weiteren Stopp erreichbar

    const candidates = byKm.filter(s => s.realKm > currentKm && s.realKm <= reachableKm && !used.has(s.name));
    const withCharging = candidates.filter(s => s.maxKw >= desiredMinKw);
    let chosen;
    let rangeExceeded = false;

    if(withCharging.length){
      // Autohof bevorzugt (falls vorhanden), sonst bester Kombi-Stopp nach Hund+Mensch
      const autohoefe = withCharging.filter(s => s.isAutohof);
      const pool = autohoefe.length ? autohoefe : withCharging;
      chosen = [...pool].sort((a,b)=> (b.hund+b.mensch) - (a.hund+a.mensch))[0];
    } else if(candidates.length){
      chosen = [...candidates].sort((a,b)=> b.laden-a.laden)[0];
    } else {
      // kein Stopp im sicheren Fenster erreichbar: nächstgelegenen darüber hinaus nehmen (Notfall)
      chosen = byKm.filter(s=>s.realKm > currentKm && !used.has(s.name)).sort((a,b)=>a.realKm-b.realKm)[0];
      rangeExceeded = true;
    }
    if(!chosen) break;

    used.add(chosen.name);
    plan.push({ ...chosen, _stopNumber: plan.length+1, _rangeExceeded: rangeExceeded });
    currentKm = chosen.realKm;
    currentSoc = TARGET_SOC_AFTER_CHARGE;
  }
  return plan;
}

function loadVehicleDb(){
  if(vehicleDbStatus !== 'idle') return;
  vehicleDbStatus = 'loading';
  fetch('vehicle-database.json')
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(data=>{
      if(!Array.isArray(data) || !data.length) throw new Error('leer');
      vehicleDb = data; vehicleDbStatus = 'ok';
    })
    .catch(()=>{ vehicleDbStatus = 'missing'; })
    .finally(()=>{ if(!stopView && currentTab==='profil') render(); });
}

  return { days, dateStr };
}

  document.getElementById('tomtomKeyInput').addEventListener('change', (e)=>{
    tomtomApiKey = e.target.value.trim();
    tomtomKeyVisible = false;
    idbSet('tomtomApiKey', tomtomApiKey);
    toast(tomtomApiKey ? 'TomTom-Key gespeichert' : 'TomTom-Key entfernt');
    render();
  });
  document.getElementById('csvInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await readFileAsText(file, 'utf-8');
      importedCharging = parseChargingCSV(text);
      chargingUpdatedAt = Date.now();
      idbSet('charging', importedCharging);
      idbSet('chargingUpdatedAt', chargingUpdatedAt);
      toast(`${importedCharging.length} Ladepunkte importiert & gespeichert`);
    }catch(err){ toast('CSV konnte nicht gelesen werden'); }
    render();
  });
  document.getElementById('xmlInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await readFileAsText(file, 'iso-8859-1');
      importedAreas = parseRestAreasXML(text);
      areasUpdatedAt = Date.now();
      idbSet('areas', importedAreas);
      idbSet('areasUpdatedAt', areasUpdatedAt);
      toast(`${importedAreas.length} Rastanlagen importiert & gespeichert`);
    }catch(err){ toast('XML konnte nicht gelesen werden'); }
    render();
  });
  document.getElementById('corridorSelect').addEventListener('change', (e)=>{
    datenRoute.corridorKm = parseInt(e.target.value, 10);
  });
  const clearBtn = document.getElementById('clearDataBtn');
  if(clearBtn) clearBtn.addEventListener('click', async ()=>{
    await Promise.all([idbDelete('charging'), idbDelete('areas')]);
    importedCharging = null;
    importedAreas = null;
    computedStops = null;
    toast('Gespeicherte Dateien gelöscht');
    render();
  });
}

let currentTab = 'fahrt';
let stopView = false;

function render(){
  const main = document.getElementById('main');
  if(stopView){ main.innerHTML = renderStopDetail(activeStop); attachStopEvents(); }
  else if(currentTab==='fahrt'){ main.innerHTML = renderFahrt(); attachFahrtEvents(); }
  else if(currentTab==='stopps'){ main.innerHTML = renderStopsList(); attachListEvents(); }
  else { main.innerHTML = renderProfil(); attachProfilEvents(); }

  document.querySelectorAll('.tab').forEach(b=>{
    b.classList.toggle('active', !stopView && b.dataset.tab===currentTab);
  });
}

function renderStopsList(){
  if(computedStops){
    const plan = planTripStops(computedStops);
    if(!plan.length){
      if(!importedCharging || !importedAreas){
        return `<h2 class="title">Stopps</h2><p class="subtitle">Für ${routeStart} → ${routeZiel} liegen keine Daten vor.</p>
        <div class="placeholder">Bitte im Profil-Tab Ladesäulenregister und Rastanlagen-Datei laden.</div>`;
      }
      return `<h2 class="title">Stopps</h2><p class="subtitle">${routeStart} → ${routeZiel} · Start-Akku ${startBattery}%</p>
      <div class="placeholder">Reichweite reicht laut Planung ohne Ladestopp bis zum Ziel.</div>`;
    }
    return `<h2 class="title">Stopps</h2><p class="subtitle">${routeStart} → ${routeZiel} · ${plan.length} Ladestopp${plan.length===1?'':'s'} nötig (Trigger: ${TRIGGER_SOC_PERCENT}% Akku, Ziel je Ladung: ${TARGET_SOC_AFTER_CHARGE}%)</p>` +
      plan.map((s)=>{
        const eq = new Set([...(s.equipment||[]), ...(s.services||[])]);
        const icons = ['toilet','motorwayRestaurant','shower','picnicFacilities'].filter(k=>eq.has(k)).map(k=>FACILITY_LABELS[k][0]);
        const badge = s._notfallLadepunkt
          ? `<span class="cap" style="color:var(--danger);">🚨 Notfall-Ladestopp – Autobahn tabu bei diesem Akkustand</span>`
          : s._rangeExceeded
            ? `<span class="cap" style="color:var(--danger);">⚠️ Stopp ${s._stopNumber} – außerhalb sicherer Reichweite!</span>`
            : `<span class="cap" style="color:var(--accent);">⚡ Stopp ${s._stopNumber} – Laden + Hund + Kaffee</span>`;
        const idx = computedStops.findIndex(x=>x.name===s.name && x.km===s.km);
        const dataStop = s._notfallLadepunkt ? 'emergency' : `c-${idx}`;
        const hundLabel = s.hund==null ? '–' : s.hund;
        const menschLabel = s.mensch==null ? '–' : s.mensch;
        return `<div class="stop-card" style="min-width:auto; margin-bottom:12px;" data-stop="${dataStop}">
          ${badge}
          <div class="name">${s.name}</div>
          <div class="icon-row">${icons.map(ic=>`<span>${ic}</span>`).join('')}<span>⚡</span></div>
          <div class="stop-meta">🐾 ${hundLabel} · ⚡ ${s.laden} (${Math.round(s.maxKw)} kW) · ☕ ${menschLabel} · ${s.realKm} km ab ${routeStart}</div>
          <div class="stop-meta" style="margin-top:4px;">${facilityTypeLabel(s)} · ${motorwayAccessLabel(s)}</div>
          ${s._notfallLadepunkt ? '' : `<div class="stop-meta" style="margin-top:4px;">📡 ${ocmInlineLabel(s)}</div>`}
        </div>`;
      }).join('');
  }
  return `<h2 class="title">Stopps</h2><p class="subtitle">Noch keine Fahrt geplant.</p>
  <div class="placeholder">Gib im Fahrt-Tab Start und Ziel ein und tippe auf "Fahrt planen", um Stopps zu sehen.</div>`;
}

function facilityTypeLabel(s){
  if(s._notfallLadepunkt) return '🚨 Ladepunkt (kein Rastplatz)';
  return s.isAutohof ? '🏢 Autohof' : '🅿️ Rastplatz';
}
function motorwayAccessLabel(s){
  if(s._notfallLadepunkt) return `📍 ca. ${s._distKm} km von deinem Standort entfernt`;
  if(s.distanceToMotorwayM==null) return '🛣️ Autobahn-Anbindung unbekannt';
  if(s.distanceToMotorwayM <= 50) return '🛣️ direkt an der Autobahn';
  return `🛣️ ca. ${Math.round(s.distanceToMotorwayM)} m abseits (kurzer Umweg)`;
}

function attachListEvents(){
  document.querySelectorAll('#main .stop-card').forEach(c=>{
    c.addEventListener('click', ()=>{ activeStop=c.dataset.stop; stopView=true; render(); });
  });
  if(computedStops){
    const plan = planTripStops(computedStops);
    const missing = plan.filter(s => !ocmStatusCache[`${s.lat.toFixed(4)},${s.lon.toFixed(4)}`]);
    if(missing.length){
      Promise.all(missing.map(s => loadOcmStatus(s.lat, s.lon).catch(()=>null))).then(()=>{
        if(currentTab==='stopps' && !stopView) render();
      });
    }
  }
}

function attachFahrtEvents(){
  document.querySelectorAll('#main .stop-card').forEach(c=>{
    c.addEventListener('click', ()=>{ activeStop=c.dataset.stop; stopView=true; render(); });
  });
  document.getElementById('planBtn').addEventListener('click', async ()=>{
    routeStart = document.getElementById('startInput').value.trim();
    routeZiel = document.getElementById('zielInput').value.trim();
    await planTrip();
  });
  document.getElementById('startInput').addEventListener('change', (e)=>{ routeStart = e.target.value.trim(); });
  document.getElementById('zielInput').addEventListener('change', (e)=>{ routeZiel = e.target.value.trim(); });
  document.getElementById('batteryInput').addEventListener('change', (e)=>{
    const v = parseInt(e.target.value, 10);
    startBattery = Number.isNaN(v) ? 80 : Math.max(0, Math.min(100, v));
    render();
  });
  document.getElementById('minKwInput').addEventListener('change', (e)=>{
    const v = parseInt(e.target.value, 10);
    desiredMinKw = Number.isNaN(v) ? 150 : Math.max(100, Math.min(400, v));
    idbSet('minKw', desiredMinKw);
    render();
  });
  document.getElementById('startBtn').addEventListener('click', openLiveMap);
  document.getElementById('seeStopsBtn').addEventListener('click', ()=>{ currentTab='stopps'; render(); });

  document.querySelectorAll('#main input[type="file"]').forEach(input=>{
    input.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      const target = e.target.dataset.photo;
      if(!file || !target) return;
      const reader = new FileReader();
      reader.onload = ()=>{ photos[target] = reader.result; idbSet('photos', photos); render(); toast('Foto aktualisiert'); };
      reader.readAsDataURL(file);
    });
  });
}

function attachStopEvents(){
  document.getElementById('backBtn').addEventListener('click', ()=>{ stopView=false; render(); });
  const favBtn = document.getElementById('favBtn');
  if(favBtn) favBtn.addEventListener('click', ()=>{
    favorites[activeStop] = !favorites[activeStop];
    render();
  });
  const ocmBtn = document.getElementById('ocmLoadBtn');
  if(ocmBtn) ocmBtn.addEventListener('click', async ()=>{
    if(!activeStop || !activeStop.startsWith('c-')) return;
    const s = computedStops[parseInt(activeStop.slice(2),10)];
    ocmBtn.textContent = 'Lade…';
    ocmBtn.disabled = true;
    try{
      await loadOcmStatus(s.lat, s.lon);
      render();
    }catch(err){
      toast(err.message || 'Open Charge Map nicht erreichbar (nur nach Deployment nutzbar)');
      render();
    }
  });
}

document.querySelectorAll('nav .tab').forEach(b=>{
  b.addEventListener('click', ()=>{ currentTab=b.dataset.tab; stopView=false; render(); });
});

// ---------- Live-Karte ("Fahrt starten") ----------
let liveMapInstance = null;
let liveMarker = null;
let liveWatchId = null;

function openLiveMap(){
  if(!routeStartCoords || !routeEndCoords){
    toast('Bitte zuerst "Fahrt planen" antippen');
    return;
  }
  document.getElementById('mapScreen').style.display = 'flex';
  document.getElementById('mapRouteLabel').textContent = `${routeStart} → ${routeZiel}`;
  setTimeout(initLiveMap, 50); // kurz warten, bis der Container sichtbar ist (Leaflet braucht eine Größe)
}

function closeLiveMap(){
  document.getElementById('mapScreen').style.display = 'none';
  if(liveWatchId !== null && navigator.geolocation){
    navigator.geolocation.clearWatch(liveWatchId);
    liveWatchId = null;
  }
}

function initLiveMap(){
  if(typeof L === 'undefined'){
    document.getElementById('mapStatus').textContent = 'Kartenbibliothek konnte nicht geladen werden (kein Netzwerk?).';
    return;
  }
  if(!liveMapInstance){
    liveMapInstance = L.map('liveMap');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap-Mitwirkende',
      maxZoom: 19,
    }).addTo(liveMapInstance);
  } else {
    liveMapInstance.eachLayer(layer => {
      if(!(layer instanceof L.TileLayer)) liveMapInstance.removeLayer(layer);
    });
  }

  const bounds = [];

  if(routeGeometry && routeGeometry.length > 1){
    L.polyline(routeGeometry, { color: '#2fd8c4', weight: 5, opacity: 0.85 }).addTo(liveMapInstance);
    routeGeometry.forEach(p => bounds.push(p));
  }

  L.marker(routeStartCoords).addTo(liveMapInstance).bindPopup(`Start: ${routeStart}`);
  L.marker(routeEndCoords).addTo(liveMapInstance).bindPopup(`Ziel: ${routeZiel}`);
  bounds.push(routeStartCoords, routeEndCoords);

  if(computedStops){
    const plan = planTripStops(computedStops);
    plan.forEach(s => {
      const icon = L.divIcon({ className:'', html: s._notfallLadepunkt ? '🚨' : '⚡', iconSize:[24,24] });
      L.marker([s.lat, s.lon], { icon }).addTo(liveMapInstance)
        .bindPopup(`<b>${s._notfallLadepunkt ? 'Notfall-Ladestopp' : 'Stopp '+s._stopNumber}</b><br>${s.name}<br>⚡ ${s.laden}${s.hund!=null ? ' · 🐾 '+s.hund : ''}`);
      bounds.push([s.lat, s.lon]);
    });
  }

  if(bounds.length) liveMapInstance.fitBounds(bounds, { padding:[30,30] });
  else liveMapInstance.setView(routeStartCoords, 7);

  setTimeout(()=> liveMapInstance.invalidateSize(), 100);

  const statusEl = document.getElementById('mapStatus');
  if(!navigator.geolocation){
    statusEl.textContent = 'Live-Standort wird von diesem Browser nicht unterstützt.';
    return;
  }
  statusEl.textContent = 'Suche GPS-Position…';
  if(liveWatchId !== null) navigator.geolocation.clearWatch(liveWatchId);
  liveWatchId = navigator.geolocation.watchPosition(
    (pos)=>{
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      const carIcon = L.divIcon({ className:'car-icon', html:'🚗', iconSize:[26,26] });
      if(!liveMarker){
        liveMarker = L.marker([lat, lon], { icon: carIcon, zIndexOffset: 1000 }).addTo(liveMapInstance);
        liveMapInstance.setView([lat, lon], 12);
      } else {
        liveMarker.setLatLng([lat, lon]);
      }
      const distToEndKm = haversineKm(lat, lon, routeEndCoords[0], routeEndCoords[1]);
      statusEl.innerHTML = `📍 Aktuelle Position erfasst · noch ca. <b>${Math.round(distToEndKm)} km</b> Luftlinie bis ${routeZiel}`;
    },
    (err)=>{
      statusEl.textContent = err.code === 1
        ? 'Standortzugriff abgelehnt – bitte in den Browser-Einstellungen erlauben.'
        : 'Standort konnte nicht ermittelt werden.';
    },
    { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
  );
}

document.getElementById('mapBackBtn').addEventListener('click', closeLiveMap);

render();

// Beim Start automatisch zuvor gespeicherte Dateien & Einstellungen aus IndexedDB laden
(async ()=>{
  try{
    const [c, a, p, cap, cons, minKw, cAt, aAt, ttKey, vModel] = await Promise.all([
      idbGet('charging'), idbGet('areas'), idbGet('photos'),
      idbGet('vehicleCapacityKWh'), idbGet('vehicleConsumptionKWh100'), idbGet('minKw'),
      idbGet('chargingUpdatedAt'), idbGet('areasUpdatedAt'), idbGet('tomtomApiKey'),
      idbGet('vehicleModel'),
    ]);
    if(c) importedCharging = c;
    if(a) importedAreas = a;
    if(p) Object.assign(photos, p);
    if(cap) vehicleCapacityKWh = cap;
    if(cons) vehicleConsumptionKWh100 = cons;
    if(minKw) desiredMinKw = minKw;
    if(cAt) chargingUpdatedAt = cAt;
    if(aAt) areasUpdatedAt = aAt;
    if(ttKey) tomtomApiKey = ttKey;
    if(vModel) vehicleModel = vModel;
    if(c || a || p || cap || cons || minKw || ttKey || vModel){ render(); toast('Gespeicherte Daten geladen'); }
  }catch(e){ /* IndexedDB nicht verfügbar - einfach normal weiter mit Upload */ }
})();

// Service Worker registrieren - Voraussetzung für "App installieren" auf Android
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
