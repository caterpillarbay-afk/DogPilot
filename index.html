<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Reiseplaner für Elektroauto, Mensch und Hund: Ladestopps und Hundepausen auf deiner Route.">
<meta name="theme-color" content="#0a1615" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f7f6" media="(prefers-color-scheme: light)">
<title>DogPilot</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<link rel="modulepreload" href="js/app.js">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#/plan" aria-label="DogPilot – Startseite">
      <img src="logo.png" alt="" width="56" height="56">
      <div>
        <p class="brand-name">DOG<b>PILOT</b></p>
        <p class="brand-sub">Reise-Co-Pilot für Mensch, Hund &amp; Auto</p>
      </div>
    </a>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menü öffnen" aria-expanded="false">
      <span data-icon="menu"></span>
    </button>
  </header>

  <main id="main" tabindex="-1">
    <noscript><p class="notice error">DogPilot benötigt JavaScript.</p></noscript>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation" hidden>
    <button type="button" data-tab="plan">
      <span data-icon="route"></span>
      Fahrt
    </button>
    <button type="button" data-tab="map">
      <span data-icon="map"></span>
      Karte
    </button>
    <button type="button" data-tab="settings">
      <span data-icon="settings"></span>
      Einstellungen
    </button>
  </nav>
</div>
<div id="drawerRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
