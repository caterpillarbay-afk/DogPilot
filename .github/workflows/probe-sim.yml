name: Probe Testfahrten (temporär)
on:
  push:
    branches: [claude/eu-vehicle-database-dogpilot-vk5isi]
    paths: [.github/workflows/probe-sim.yml, scripts/tmp-sim10.mjs]
permissions:
  contents: read
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/tmp-sim10.mjs
