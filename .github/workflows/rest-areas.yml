name: Rastanlagen aktualisieren

# Lädt Rastanlagen samt Ausstattung aus OpenStreetMap (Geofabrik-Extrakt, gefiltert mit osmium)
# und committet rest-areas.json, falls sich etwas geändert hat.
# - automatisch am 1. jedes Monats (OpenStreetMap wird laufend gepflegt)
# - bei Änderungen am Generator-Skript
# - manuell: GitHub → Actions → "Rastanlagen aktualisieren" → Run workflow
on:
  schedule:
    - cron: '57 4 1 * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/build-rest-areas.mjs
      - .github/workflows/rest-areas.yml

permissions:
  contents: write

concurrency:
  group: rest-areas-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: osmium installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: OpenStreetMap-Extrakt Deutschland laden (Geofabrik)
        run: curl -sSfL --retry 3 -o germany.osm.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf && ls -lh germany.osm.pbf
      - name: Rastanlagen, Einrichtungen und Grünflächen herausfiltern
        run: |
          osmium tags-filter germany.osm.pbf \
            nwr/highway=services,rest_area \
            nwr/amenity=toilets,restaurant,fast_food,cafe,drinking_water,fuel \
            nwr/shop=convenience,kiosk \
            nwr/leisure=picnic_table,playground,dog_park,park \
            nwr/tourism=picnic_site \
            wr/landuse=forest,meadow,recreation_ground \
            wr/natural=wood,grassland,heath \
            -o filtered.osm.pbf
          rm germany.osm.pbf
          osmium export filtered.osm.pbf -f geojsonseq -o features.geojsonseq
          ls -lh filtered.osm.pbf features.geojsonseq
      - name: rest-areas.json erzeugen
        run: set -o pipefail; node scripts/build-rest-areas.mjs features.geojsonseq | tee build.log
      - name: Commit rest-areas.json
        run: |
          git add rest-areas.json charger-sites.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          SUMMARY=$(grep -oE '[0-9]+ Rastanlagen' build.log || echo "neue Daten")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rastanlagen aktualisiert: $SUMMARY"
          git push
