name: Rastanlagen aktualisieren

# Lädt Rastanlagen samt Ausstattung aus OpenStreetMap und committet
# rest-areas.json, falls sich etwas geändert hat.
# - automatisch am 1. jedes Monats (OpenStreetMap wird laufend gepflegt)
# - bei Änderungen am Generator-Skript
# - manuell: GitHub → Actions → "Rastanlagen aktualisieren" → Run workflow
on:
  schedule:
    - cron: '57 4 1 * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/build-rest-areas.mjs
      - .github/workflows/rest-areas.yml

permissions:
  contents: write

concurrency:
  group: rest-areas-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Daten abrufen
        run: set -o pipefail; node scripts/build-rest-areas.mjs | tee build.log
      - name: Commit rest-areas.json
        run: |
          git add rest-areas.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          SUMMARY=$(grep -oE '[0-9]+ Rastanlagen' build.log || echo "neue Daten")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rastanlagen aktualisiert: $SUMMARY"
          git push
