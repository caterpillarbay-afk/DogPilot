name: Probe Ortssuche (temporär)
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://photon.komoot.io/api/?q=Prien%20am%20Chiemsee&limit=2&lang=de" "https://photon.komoot.io/api/?q=Alzey&limit=1" "https://photon.komoot.io/reverse?lat=49.74&lon=8.11&lang=de"; do
            echo "=== $u"; curl -s -m 20 -D - -o body.txt -H 'Origin: https://dogpilot.caterpillar-bay.workers.dev' "$u" | grep -iE "^HTTP|access-control-allow-origin|content-type"; head -c 300 body.txt; echo
          done
