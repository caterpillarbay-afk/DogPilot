name: Probe open-ev-data (temporär)
on:
  push:
    branches: [claude/eu-vehicle-database-dogpilot-vk5isi]
    paths: [.github/workflows/probe-ev-data.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone --depth 1 https://github.com/chargeprice/open-ev-data oed || git clone --depth 1 https://github.com/KilowattApp/open-ev-data oed
          cd oed; ls -la; ls data | head
          echo "=== LICENSE"; cat LICENSE* 2>/dev/null | head -30
          echo "=== README"; head -80 README.md
          echo "=== Q4/Model 3 Beispiele"
          node -e '
            const d = require("./data/ev-data.json"); const list = d.data || d;
            console.log("Einträge:", list.length, "Schlüssel:", Object.keys(list[0]).join(","));
            for (const v of list.filter(v => /Q4|Model 3/.test(v.model)).slice(0, 8)) console.log(JSON.stringify({brand: v.brand, model: v.model, variant: v.variant, year: v.release_year, bat: v.usable_battery_size, dc: v.dc_charger && v.dc_charger.max_power}));
            const brands = {}; for (const v of list) brands[v.brand] = (brands[v.brand]||0)+1; console.log(JSON.stringify(brands));
          '
