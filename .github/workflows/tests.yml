name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax prüfen
        run: for f in js/*.js scripts/*.mjs sw.js; do node --check "$f"; done
      - name: Unit-Tests
        run: node --test tests/*.test.mjs
