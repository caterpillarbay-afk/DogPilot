name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax prüfen
        run: for f in js/*.js scripts/*.mjs sw.js; do node --check "$f"; done
      - name: Unit-Tests
        run: node --test tests/*.test.mjs

  # Browser-Tests: die App in Chromium durchklicken (alle externen Dienste nachgestellt).
  # Playwright wird nur hier installiert – das Projekt selbst bleibt ohne package.json.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-Tests
        run: node --test --test-concurrency=1 tests/e2e/*.e2e.mjs
