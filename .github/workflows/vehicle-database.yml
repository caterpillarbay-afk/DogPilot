name: Fahrzeugdatenbank aktualisieren

# Ruft die EEA-CO2-Monitoringdaten ab und committet vehicle-database.json.
# Läuft bei Änderungen am Generator-Skript und lässt sich manuell starten
# (GitHub → Actions → "Fahrzeugdatenbank aktualisieren" → Run workflow).
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-vehicle-database.mjs
      - .github/workflows/vehicle-database.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-vehicle-database.mjs
      - name: Commit vehicle-database.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vehicle-database.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Fahrzeugdatenbank aus EEA-Daten aktualisiert"
          git push
