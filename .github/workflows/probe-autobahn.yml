name: Probe Autobahn-API (temporär)
on:
  push:
    branches: [claude/eu-vehicle-database-dogpilot-vk5isi]
    paths: [.github/workflows/probe-autobahn.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://verkehr.autobahn.de/o/autobahn
          curl -s -D - -o roads.json -H 'Origin: https://example.org' "$B/" | grep -i -E "^HTTP|access-control|content-type|content-length"
          head -c 400 roads.json; echo
          for kind in roadworks closure warning; do
            echo "=== A7 $kind"; curl -s -D - -o a7.json -H 'Origin: https://example.org' "$B/A7/services/$kind" | grep -i -E "^HTTP|access-control|content-length"
            python3 - "$kind" <<'PY'
          import json,sys
          d=json.load(open('a7.json')); k=list(d.keys()); print('Schlüssel', k)
          items=d[k[0]] if k else []
          print('Anzahl', len(items))
          for it in items[:2]: print(json.dumps({x: it.get(x) for x in ('identifier','title','subtitle','coordinate','isBlocked','startTimestamp','display_type','future','description','delayTimeValue','abnormalTrafficType','extent','routeRecommendation','impact','lorryParkingFeatureIcons')}, ensure_ascii=False)[:900])
          PY
          done
          echo "=== Gesamtgröße aller closures+warnings+roadworks"
          python3 - <<'PY'
          import json, urllib.request, time
          roads=json.load(urllib.request.urlopen('https://verkehr.autobahn.de/o/autobahn/'))['roads']
          print('Autobahnen', len(roads))
          tot={}; n={}; t=time.time()
          for kind in ['closure','warning','roadworks']:
              tot[kind]=0; n[kind]=0
              for r in roads:
                  try:
                      raw=urllib.request.urlopen(f'https://verkehr.autobahn.de/o/autobahn/{r}/services/{kind}', timeout=30).read()
                      tot[kind]+=len(raw); d=json.loads(raw); n[kind]+=len(list(d.values())[0])
                  except Exception as e: pass
          print({k:(n[k], round(tot[k]/1e6,1),'MB') for k in tot}, 'Sekunden', round(time.time()-t))
          PY
