plugins {
    id 'com.android.application'
}

android {
    namespace 'de.dogpilot.app'
    compileSdk 35

    defaultConfig {
        applicationId 'de.dogpilot.app'
        minSdk 26
        targetSdk 34   // 34: Android 15 zwingt sonst die Seite unter die Statusleiste
        // Jede Version aus GitHub bekommt eine höhere Nummer, damit sie sich über die alte installiert
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: 'dev'
    }

    // Fester Schlüssel im Projekt, damit Updates sich über die vorhandene App installieren lassen.
    // Die App wird nur direkt verteilt (kein Play Store); der Schlüssel schützt also nichts Geheimes.
    signingConfigs {
        release {
            storeFile file('dogpilot.keystore')
            storePassword 'dogpilot'
            keyAlias 'dogpilot'
            keyPassword 'dogpilot'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
